
name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run check
      - run: npm run test --if-present -- --run
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t shop .

  publish:
    needs: [check, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and publish Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:1.0.0 .
          docker push ghcr.io/${{ github.repository }}:1.0.0

 
  run-image:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image
        run: docker pull ghcr.io/${{ github.repository }}:1.0.0

      - name: Run container
        run: docker run -d -p 8080:80 --name least-surprise ghcr.io/${{ github.repository }}:1.0.0

      - name: Test website
        run: |
          docker ps -a
          docker logs least-surprise
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://localhost:8080


  deploy:
    needs: check
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      PROD: ${{ github.event_name == 'push' && '--prod' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=$TARGET --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build $PROD --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: |
          url=$(vercel deploy --prebuilt $PROD --token=${{ secrets.VERCEL_TOKEN }})
          echo "### $TARGET: $url" >> "$GITHUB_STEP_SUMMARY"
